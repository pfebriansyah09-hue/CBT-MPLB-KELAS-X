function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function acak(arr, seed){
  const a = arr.slice(); let x = (seed >>> 0) || 1;
  const rnd = () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

// Urutan soal dan pilihan jawaban untuk satu peserta. Jawaban tetap disimpan dengan nomor asli soal,

function urutan(sem){
  const key = S.user.id + '|' + sem;
  if (!URUT[key]){
    const soal = soalOf(sem);
    const ord = acak(soal.map((_, i) => i), hashStr('soal|' + key));
    const opt = {};
    soal.forEach((q, i) => { if (q.j !== 'ISIAN') opt[i] = acak(q.o.map((_, k) => k).filter(k => q.o[k]), hashStr('opsi|' + key + '|' + i)); });
    URUT[key] = {ord, opt};
  }
  return URUT[key];
}

function validSoalV4(v){
  if (!Array.isArray(v) || v.length < 1 || v.length > 100) return 'Jumlah soal harus 1 sampai 100.';
  for (const x of v){
    if (!x || !['PG', 'PGK', 'ISIAN'].includes(x.j)) return 'Jenis soal harus PG, PGK, atau ISIAN.';
    if (!x.q) return 'Ada soal tanpa teks.';
    if (x.j === 'PG' && (!Array.isArray(x.o) || x.o.length !== 5 || !(Number.isInteger(x.a) && x.a >= 0 && x.a <= 4))) return 'PG harus memiliki 5 opsi dan kunci a berupa angka 0 sampai 4.';
    if (x.j === 'PGK' && (!Array.isArray(x.o) || x.o.length !== 5 || !Array.isArray(x.a) || !x.a.length)) return 'PGK harus memiliki 5 opsi dan kunci a berupa daftar angka.';

  }
  return '';
}

function tulisHasil(sem){
  const id = S.user.id, d = S.rec[sem];
  lokalTulis(id, sem, d);
  if (!DB) return Promise.resolve();
  const key = 'hasil/' + id + '_' + sem;
  kotor[key] = true;
  if (jalan[key]) return jalan[key];
  jalan[key] = (async () => {
    while (kotor[key]){
      kotor[key] = false;
      if (S.rec[sem]) S.rec[sem].updatedAt = Date.now();
      const body = JSON.parse(JSON.stringify(S.rec[sem] || {}));
      try { await tunggu(DB.doc(key).set(body)); }

    }
    delete jalan[key];
  })();
  return jalan[key];
}

  CONFIG.peserta.forEach(p => { adm[p.id] = {s1: null, s2: null}; admKor[p.id] = {}; });
  let ok = false;
  if (DB){
    try {
      const snap = await tunggu(DB.collection('hasil').get());
      snap.docs.forEach(doc => {
        const m = doc.id.match(/^(.+)_(s1|s2)$/);
        if (m && adm[m[1]]) adm[m[1]][m[2]] = doc.data();
      });
      const snapK = await tunggu(DB.collection('koreksi').get());
      snapK.docs.forEach(doc => {
        const m = doc.id.match(/^(.+)_(s1|s2)$/);
        if (m && admKor[m[1]]) admKor[m[1]][m[2]] = (doc.data() || {}).k || {};
      });
      ok = true;
    } catch(e) { ok = false; }
  }
  if (!ok){
    CONFIG.peserta.forEach(p => JADWAL.forEach(j => {
      adm[p.id][j.id] = lokalBaca(p.id, j.id);
      const k = lokalBacaK(p.id, j.id);
      admKor[p.id][j.id] = (k && k.k) || {};
    }));
  }
  S.dbOk = !!DB && ok;
  S.adm = adm; S.admKor = admKor;
  S.admLoaded = true;
}

/* ===== 5. WAKTU ===== */
function jamDetik(ms){
  const t = new Date(ms + WIB);
  return pad(t.getUTCHours()) + ':' + pad(t.getUTCMinutes()) + ':' + pad(t.getUTCSeconds());
}
function fmtTgl(ms){
  const t = new Date(ms + WIB);
  return t.getUTCDate() + ' ' + BULAN[t.getUTCMonth()] + ' ' + t.getUTCFullYear() + ' pukul ' + pad(t.getUTCHours()) + '.' + pad(t.getUTCMinutes()) + ' WIB';
}

/* ===== 6. PENILAIAN ===== */
function terjawab(v){
  if (v === undefined || v === null) return false;
  if (typeof v === 'string') return v.trim() !== '';
  if (Array.isArray(v)) return v.length > 0;
  return true;
}
function levenshtein(a, b){
  const m = a.length, n = b.length;
  let prev = Array.from({length: n + 1}, (_, i) => i);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function kataCocok(w, sinonim){
  if (w === sinonim) return true;
  if (sinonim.length >= 5 && w.length >= 4 && Math.abs(w.length - sinonim.length) <= 1) return levenshtein(w, sinonim) <= 1;
  return false;
}
function normTeks(t){ return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
function nilaiIsian(q, v){
  const n = normTeks(v);
  if (!n) return 'kosong';
  // Jawaban sama persis dengan kunci (atau salah satu alternatif yang dipisah / atau ;) = benar.
  if (String(q.kunci || '').split(/[\/;\n]+/).map(normTeks).filter(Boolean).includes(n)) return 'benar';
  const konsep = (q.konsep || []).map(g => g.map(normTeks).filter(Boolean)).filter(g => g.length);
  if (!konsep.length) return 'tunggu';
  const kata = n.split(' '), pad = ' ' + n + ' ';
  const cocok = konsep.filter(grup => kata.some(w => grup.some(x => kataCocok(w, x))) || grup.some(x => x.includes(' ') && pad.includes(' ' + x + ' '))).length;
  const minimal = q.min || Math.ceil(konsep.length * 0.6);
  if (cocok >= minimal) return 'benar';
  return cocok > 0 ? 'tunggu' : 'salah';
}
function nilaiSoal(q, v){
  if (q.j === 'PG') return v == null ? 'kosong' : (v === q.a ? 'benar' : 'salah');
  if (q.j === 'PGK'){
    if (!Array.isArray(v) || !v.length) return 'kosong';
    const ok = v.length === q.a.length && v.every((x, i) => x === q.a[i]);
    return ok ? 'benar' : 'salah';
  }
  return nilaiIsian(q, v);
}
// Nilai akhir: koreksi admin (benar/salah) didahulukan; bila tidak ada, dipakai penilaian otomatis.
function nilaiAkhir(q, idx, v, kor){
  const o = kor && kor[idx];
  if (o === 'benar' || o === 'salah') return o;
  return nilaiSoal(q, v);
}
const bobotAkt = () => { const o = PENG.bobot || {}, c = CONFIG.bobot; const v = k => (o[k] !== undefined && o[k] !== '' && !isNaN(o[k])) ? Number(o[k]) : c[k]; return {pg: v('pg'), pgk: v('pgk'), isian: v('isian')}; };
const poin = q => bobotAkt()[q.j.toLowerCase()];
function hitungKomp(sem){ const h = {PG: 0, PGK: 0, ISIAN: 0}; soalOf(sem).forEach(x => { if (x.j in h) h[x.j]++; }); return h; }
function komposisiTeks(sem){ const h = hitungKomp(sem), b = bobotAkt(); return `${soalOf(sem).length} soal: ${h.PG} pilihan ganda, ${h.PGK} pilihan ganda kompleks, dan ${h.ISIAN} isian singkat. Nilai maksimum ${h.PG * b.pg + h.PGK * b.pgk + h.ISIAN * b.isian}.`; }
function ringkas(sem, rec, kor){
  const ans = (rec && rec.ans) || {};
  let pts = 0, b = 0, s = 0, k = 0, tunggu = 0, maks = 0;
  soalOf(sem).forEach((q, i) => {
    maks += poin(q);
    const st = nilaiAkhir(q, i, ans[i], kor);
    if (st === 'benar'){ b++; pts += poin(q); }
    else if (st === 'salah') s++;
    else if (st === 'tunggu') tunggu++;
    else k++;
  });
  const penalti = rec && rec.submittedAt ? penaltiPel(rec.pelanggaran) : 0;
  pts = Math.max(0, pts - penalti);
  return {pts, b, s, k, tunggu, maks, penalti};
}

/* ===== 7. STATUS ===== */
function kumpul(sem, auto){
  const d = S.rec[sem];
  if (!d || d.submittedAt) return;
  d.submittedAt = Date.now();
  d.auto = !!auto;
  tulisHasil(sem);
}
function statusSem(j){
  const sem = j.id, now = Date.now(), d = S.rec[sem];
  const w = {mulai: j.bukaMs, selesai: tutupUser(j)};
  if (d && d.submittedAt) return {kode: 'selesai', w, sisa: null};
  if (d && d.startAt && now >= batasUjian(j, d)){ kumpul(sem, true); return {kode: 'selesai', w, sisa: null}; }
  if (now < w.mulai) return {kode: 'belum', w, sisa: null};
  if (now >= w.selesai) return {kode: 'tutup', w, sisa: null};
  return {kode: d && d.startAt ? 'lanjut' : 'buka', w, sisa: null};
}
async function muatSemuaSiswa(){
  for (const j of JADWAL){
    S.rec[j.id] = await bacaHasil(S.user.id, j.id);
    S.kor[j.id] = await bacaKoreksi(S.user.id, j.id);
  }
}
async function mulai(sem){
  S.rec[sem] = await bacaHasil(S.user.id, sem);
  const st = statusSem(JADWAL.find(x => x.id === sem));
  if (st.kode === 'buka'){
    S.rec[sem] = {startAt: Date.now(), ans: {}, flag: {}, cur: 0};
    tulisHasil(sem);
    S.sem = sem; S.view = 'ujian';
  } else if (st.kode === 'lanjut'){
    S.sem = sem; S.view = 'ujian';
  }
  render();
}
function aksi(sem){
  const st = statusSem(JADWAL.find(x => x.id === sem));
  if (st.kode === 'buka') return instruksi(sem);
  if (st.kode === 'lanjut'){ masukLayarPenuh(); S.sem = sem; S.view = 'ujian'; return render(); }
  if (st.kode === 'selesai'){ S.sem = sem; S.view = 'hasil'; render(); }
}
function instruksi(sem){
  S.sem = sem; S.view = 'instruksi';
  render();
  startPrep();
}
function startPrep(){
  clearInterval(S.prepTimer);
  let detik = 10;
  const perbarui = () => {
    const c = $('#prepCount'), b = $('#mulai'), m = $('#prepMessage');
    if (!c || !b) return clearInterval(S.prepTimer);
    c.textContent = String(Math.max(0, detik));
    if (detik > 0){ b.disabled = true; b.textContent = `Mulai Ujian (${detik})`; }
    else {
      clearInterval(S.prepTimer);
      b.disabled = false; b.textContent = 'Mulai Ujian';
      if (m) m.textContent = 'Waktu persiapan selesai. Anda dapat mulai mengerjakan ujian sekarang.';
    }
  };
  perbarui();
  S.prepTimer = setInterval(() => { detik -= 1; perbarui(); }, 1000);
}

function kartuSelesai(r, sem){
  const pct = r.maks ? Math.max(0, Math.min(100, Math.round(r.pts / r.maks * 100))) : 0;
  const m = MOTIVASI.find(x => pct >= x.min), kt = m.q[hashStr(S.user.id + sem) % m.q.length];
  const warna = ['#fde68a', '#86efac', '#93c5fd', '#fca5a5', '#ffffff'];
  const konfeti = Array.from({length: 18}, (_, i) => `<i style="left:${(i * 37) % 100}%;background:${warna[i % 5]};animation-delay:${(i % 6) * 0.35}s;animation-duration:${2.6 + (i % 4) * 0.5}s"></i>`).join('');
  return `<div class="selesai"><div class="konfeti" aria-hidden="true">${konfeti}</div>
    <div class="ikon">${m.ikon}</div><h2>Ujian Selesai!</h2>
    <p class="sapa">Terima kasih, <b>${esc(S.user.nama)}</b>. Jawabanmu sudah tersimpan dengan aman.</p>
    <div class="cincin" style="--p:${pct}"><div><b>${r.pts}</b><span>dari ${r.maks}</span></div></div>
    <p class="mjudul">${m.judul}</p><p class="mkata">“${kt}”</p></div>`;
}
function viewHasil(){
  const sem = S.sem, d = S.rec[sem] || {}, r = ringkas(sem, d, S.kor[sem]), soal = soalOf(sem), u = urutan(sem);
  let waktu = '-';
  if (d.submittedAt) waktu = fmtTgl(d.submittedAt);
  const label = {benar: 'Benar', salah: 'Salah', kosong: 'Kosong', tunggu: 'Menunggu tinjauan'};
  const tabel = kunciAktif() ? `<div class="tbl"><table>
      <tr><th>No</th><th>Soal</th><th>Jawaban Anda</th><th>Kunci</th><th>Status</th></tr>
      ${u.ord.map((qi, k) => { const q = soal[qi], v = (d.ans || {})[qi], st = nilaiAkhir(q, qi, v, S.kor[sem]);
        return `<tr><td>${k + 1}</td><td class="jwb">${esc(q.q)}</td><td class="jwb">${teksJawaban(q, v)}</td><td class="jwb">${teksKunci(q)}</td><td><span class="badge ${st}">${label[st]}</span></td></tr>`; }).join('')}
    </table></div>` : '<p class="muted">Kunci jawaban belum ditampilkan.</p>';
  return `<header class="hdr"><div><b>${esc(S.user.nama)}</b><div class="sub">Manajemen Perkantoran</div></div>
      <button class="ghost" onclick="kembali()">Kembali ke Beranda</button></header>

      <p class="only-print"><b>${esc(S.user.nama)}</b> · ${esc(CONFIG.namaAplikasi)} · ${esc(CONFIG.sekolah)}</p>${kartuSelesai(r, sem)}
      ${r.tunggu ? `<p class="note"><b>${r.tunggu} jawaban isian perlu ditinjau admin.</b> Nilai di atas bersifat sementara untuk jawaban tersebut dan akan diperbarui setelah admin memeriksa kecocokan kata kunci.</p>` : ''}
      <p class="note">Pelanggaran keluar dari halaman ujian: ${Number(d.pelanggaran || 0)} kali · Pengurangan nilai: ${r.penalti || 0} poin (2 pelanggaran pertama hanya peringatan, selanjutnya 10 poin per pelanggaran; pelanggaran ke-5 mengakhiri ujian).</p>
      <div class="rekap"><div><b>${r.b}</b>Benar</div><div><b>${r.s}</b>Salah</div><div><b>${r.k}</b>Kosong</div></div>
      <p class="muted">Dikumpulkan: ${waktu}${d.auto ? ' (otomatis karena waktu habis)' : ''}</p>
      ${tabel}
      <div class="end row"><button class="ghost" onclick="window.print()">Cetak / Simpan PDF</button><button onclick="kembali()">Kembali ke Beranda</button></div>
    </section></main>`;
}

function teksJawaban(q, v, huruf){
  const h = (k) => huruf ? HURUF[k] + '. ' : '';
  if (q.j === 'ISIAN') return terjawab(v) ? esc(v) : '<span class="muted">-</span>';
  if (q.j === 'PG') return v == null ? '<span class="muted">-</span>' : esc(h(v) + q.o[v]);
  if (!Array.isArray(v) || !v.length) return '<span class="muted">-</span>';
  return v.map(k => esc(h(k) + q.o[k])).join('<br>');
}
function teksKunci(q, huruf){
  const h = (k) => huruf ? HURUF[k] + '. ' : '';
  if (q.j === 'ISIAN') return esc(q.kunci);
  if (q.j === 'PG') return esc(h(q.a) + q.o[q.a]);
  return q.a.map(k => esc(h(k) + q.o[k])).join('<br>');
}

function admCell(sem, rec, kor){
  if (!rec || !rec.startAt) return '<span class="badge kosong">Belum mulai</span>';
  if (rec.submittedAt){
    const r = ringkas(sem, rec, kor);
    return `<span class="badge benar">Selesai</span> <b>${r.pts}</b>/${r.maks}${rec.auto ? ' <span class="muted">(otomatis)</span>' : ''}`;
  }
  const soal = soalOf(sem), n = soal.filter((q, i) => terjawab((rec.ans || {})[i])).length;
  return `<span class="badge tunggu">Sedang ujian</span> ${n}/${soal.length} (${Math.round(n / soal.length * 100)}%)`;
}
function admWaktu(rec){
  if (!rec || !rec.updatedAt) return '';
  const t = new Date(rec.updatedAt + WIB);
  return `<div class="muted" style="font-size:12px">Pembaruan ${pad(t.getUTCHours())}.${pad(t.getUTCMinutes())}.${pad(t.getUTCSeconds())} WIB</div>`;
}

function batasUjian(j, d){
  const tj = tutupUser(j);
  if (!d || !d.startAt || !CONFIG.durasiMenit) return tj;
  const id = S.user ? S.user.id : '';
  const ext = Number(PENG.perpanjang && PENG.perpanjang[id + '_' + j.id]) || 0;
  const tambah = ext > j.tutupMs ? Math.min(ext - j.tutupMs, 600 * 60000) : 0;
  return Math.min(tj, d.startAt + CONFIG.durasiMenit * 60000 + tambah);
}

function ujianD(){
  const r = S.rec[S.sem] || (S.rec[S.sem] = {ans: {}, flag: {}, cur: 0});
  r.ans = r.ans || {}; r.flag = r.flag || {}; r.cur = r.cur || 0;
  return r;
}
function pilih(k){
  const d = ujianD(), u = urutan(S.sem), qi = u.ord[d.cur], q = soalOf(S.sem)[qi];
  const asli = u.opt[qi][k];          // ubah posisi tampilan menjadi nomor pilihan asli
  if (q.j === 'PG') d.ans[qi] = asli;
  else {
    const a = Array.isArray(d.ans[qi]) ? d.ans[qi].slice() : [];
    const p = a.indexOf(asli);
    if (p >= 0) a.splice(p, 1); else a.push(asli);
    a.sort((x, y) => x - y);
    d.ans[qi] = a;
  }
  tulisHasil(S.sem);
  render();
}
function isianIn(v){

function pindah(n){

document.addEventListener('keydown', e => {
  if (S.view !== 'ujian' || e.ctrlKey || e.metaKey || e.altKey || document.getElementById('modalKirim')) return;
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const d = S.rec[S.sem]; if (!d || d.submittedAt) return;
  const k = e.key.toUpperCase(), q = soalOf(S.sem)[urutan(S.sem).ord[ujianD().cur]];
  if (q.j !== 'ISIAN' && /^[A-E1-5]$/.test(k)){ pilih(isNaN(k) ? HURUF.indexOf(k) : Number(k) - 1); e.preventDefault(); }
  else if (k === 'ARROWRIGHT'){ pindah(1); e.preventDefault(); }
  else if (k === 'ARROWLEFT'){ pindah(-1); e.preventDefault(); }
  else if (k === 'R'){ tandai(); }
});

// Dialog konfirmasi di dalam aplikasi. confirm() dan prompt() bawaan browser sering diblokir (misalnya di jendela sematan), sehingga tombolnya terlihat mati.
function tanya(pesan, o){
  o = o || {};
  return new Promise(ok => {
    const d = document.createElement('div'); d.className = 'ov'; d.id = 'dialogApp';
    d.innerHTML = `<div class="card modal" role="dialog" aria-modal="true"><p style="margin-top:0;line-height:1.5">${esc(pesan)}</p>${o.teks ? '<input id="dlgIn" autocomplete="off" style="width:100%;margin:8px 0">' : ''}<div class="row end" style="margin-top:12px"><button class="ghost" id="dlgNo">Batal</button><button class="warn" id="dlgYa">${esc(o.ya || 'Lanjutkan')}</button></div></div>`;
    document.body.appendChild(d);
    const selesai = v => { d.remove(); ok(v); };
    d.querySelector('#dlgNo').onclick = () => selesai(o.teks ? null : false);
    d.querySelector('#dlgYa').onclick = () => selesai(o.teks ? d.querySelector('#dlgIn').value : true);
    const i = d.querySelector('#dlgIn'); if (i){ i.focus(); i.onkeydown = e => { if (e.key === 'Enter') d.querySelector('#dlgYa').click(); }; }
  });
}

async function admTambahWaktu(ids, mnt, sem){
  mnt = Math.floor(Number(mnt));
  if (!(mnt >= 1 && mnt <= 600)) return setAdmMsg('Isi tambahan waktu antara 1 dan 600 menit.');
  const j = JADWAL.find(x => x.id === sem), now = Date.now();
  PENG.perpanjang = PENG.perpanjang || {};
  ids.forEach(id => { const k = id + '_' + sem; PENG.perpanjang[k] = Math.max(now, j.tutupMs, Number(PENG.perpanjang[k]) || 0) + mnt * 60000; });
  const ok = await simpanPengaturan();
  S.admMsg = `+${mnt} menit (${j.label}) untuk ${ids.length} siswa.` + (ids.length === 1 ? ` Batas baru: ${fmtTgl(PENG.perpanjang[ids[0] + '_' + sem])}.` : '') + (ok ? '' : ' Gagal disinkronkan ke perangkat siswa.');
  render();
}
async function admResetIds(ids, sems){
  const lab = sems.length > 1 ? 'semua ujian' : JADWAL.find(x => x.id === sems[0]).label;
  if (!(await tanya(`Reset ${lab} untuk ${ids.length} siswa? Jawaban dan penilaiannya dihapus dan siswa dapat mengerjakan ulang.`))) return;
  let gagal = false;
  for (const id of ids) for (const sem of sems){
    if (DB){
      await tunggu(DB.doc('hasil/' + id + '_' + sem).delete()).catch(() => { gagal = true; });
      await tunggu(DB.doc('koreksi/' + id + '_' + sem).delete()).catch(() => { gagal = true; });
    }
    lokalTulis(id, sem, null); lokalTulisK(id, sem, null);
  }
  S.admPil = {}; await muatAdm();
  S.admMsg = gagal ? 'Sebagian data gagal dihapus. Coba lagi.' : `${lab} untuk ${ids.length} siswa sudah direset. Minta siswa menutup halaman ujian lalu masuk lagi.` + (sems.some(x => Date.now() >= JADWAL.find(y => y.id === x).tutupMs) ? ' Batas jadwal sudah lewat, tambahkan waktu agar siswa bisa mengerjakan ulang.' : '');
  render();
}

async function admResetPw(id){
  const p = CONFIG.peserta.find(x => x.id === id);
  if (!(await tanya(`Buat password baru untuk ${p.nama}? Password lama tidak berlaku lagi.`))) return;
  const np = randPwKapital();
  PENG.akun = PENG.akun || {};
  PENG.akun[id] = Object.assign({}, PENG.akun[id] || {}, {password: np});
  const ok = await simpanPengaturan();
  S.admMsg = `Password baru untuk ${p.nama}: ${np}` + (ok ? ' (berikan kepada siswa yang bersangkutan).' : ' Gagal menyimpan.');
  render();
}
function randPwKapital(){
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let t;
  do { t = ''; for (let i = 0; i < 9; i++) t += c[Math.floor(Math.random() * c.length)]; }
  while (!/[A-Z]/.test(t) || !/[0-9]/.test(t));
  return t;
}

const JENIS_NAMA = {PG: 'Pilihan ganda', PGK: 'PG kompleks', ISIAN: 'Isian singkat'};
const HURUF_OPSI = 'ABCDE';
function draftSoal(){
  S.admDrafts = S.admDrafts || {};
  const k = S.admSoalSem;
  if (!S.admDrafts[k]) S.admDrafts[k] = JSON.parse(JSON.stringify(soalOf(k)));
  return S.admDrafts[k];
}
function noAktif(){ return Math.min(Math.max(S.admSoalNo || 1, 1), draftSoal().length || 1); }
function normalisasiSoal(x, j){
  const q = {j: j || x.j, q: x.q || ''};
  if (q.j === 'ISIAN'){
    q.kunci = x.kunci || '';
    q.konsep = Array.isArray(x.konsep) ? x.konsep.filter(g => Array.isArray(g) && g.length) : [];
    if (!q.konsep.length && q.kunci){ const w = [...new Set(q.kunci.toLowerCase().split(/[^a-z0-9]+/).filter(z => z.length >= 3))]; q.konsep = w.length ? w.map(z => [z]) : [[q.kunci.toLowerCase().trim()]]; }
  } else {
    q.o = [0, 1, 2, 3, 4].map(i => (x.o && x.o[i]) || '');
    const a = x.a;
    if (q.j === 'PGK') q.a = Array.isArray(a) ? a.slice() : (Number.isInteger(a) && a >= 0 ? [a] : []);
    else q.a = Array.isArray(a) ? (a.length ? a[0] : -1) : (Number.isInteger(a) ? a : -1);
  }
  return q;
}

// Membaca isian formulir ke draf. Hanya membaca elemen sesuai jenis yang sedang tampil.
function bacaFormSoal(){
  const form = $('#f-form'); if (!form) return;
  const draft = draftSoal(), no = noAktif();
  const jTampil = form.dataset.j, jBaru = $('#f-j').value;
  const q = {j: jTampil, q: $('#f-q').value.trim()};
  if (jTampil === 'ISIAN'){
    q.kunci = $('#f-kunci').value.trim();
    q.konsep = $('#f-konsep').value.split('\n').map(b => b.split('/').map(s => s.trim().toLowerCase()).filter(Boolean)).filter(g => g.length);
  } else {
    q.o = [0, 1, 2, 3, 4].map(i => $('#f-o' + i).value.trim());
    const dipilih = [...form.querySelectorAll('input[name="kunci"]:checked')].map(c => Number(c.value));
    q.a = jTampil === 'PGK' ? dipilih : (dipilih.length ? dipilih[0] : -1);
  }
  draft[no - 1] = normalisasiSoal(q, jBaru);
}
function validSatuSoal(x){
  if (!x.q) return 'teks soal belum diisi.';
  if (x.j === 'ISIAN') return x.kunci ? '' : 'jawaban isian belum diisi.';
  const ada = x.o.map((t, i) => t ? i : -1).filter(i => i >= 0);
  if (ada.length < 2) return 'isi minimal 2 pilihan jawaban.';
  if (x.j === 'PG' && !ada.includes(x.a)) return 'tandai satu kunci jawaban pada pilihan yang terisi.';
  if (x.j === 'PGK' && !(x.a.length && x.a.every(i => ada.includes(i)))) return 'centang kunci jawaban pada pilihan yang terisi.';
  return '';
}

function cekSemuaSoal(v){
  if (!Array.isArray(v) || v.length < 1 || v.length > 100) return 'Jumlah soal harus 1 sampai 100.';
  for (let i = 0; i < v.length; i++){
    const e = validSatuSoal(normalisasiSoal(v[i]));
    if (e){ S.admSoalNo = i + 1; return `Nomor ${i + 1}: ${e}`; }
  }
  return validSoalV4(v.map(x => normalisasiSoal(x)));
}

// Pemisah CSV yang mendukung tanda kutip dan baris baru di dalam sel.
function parseCSV(t){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){
      if (c === '"'){ if (t[i + 1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && t[i + 1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = '';
    } else f += c;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function csvKeSoal(teks){
  const baris = parseCSV(teks);
  if (baris.length < 2) throw new Error('file harus memuat baris judul dan minimal satu soal.');
  const judul = baris[0].map(h => h.trim().toLowerCase());
  const ambil = (r, nama) => { const k = judul.indexOf(nama); return k < 0 ? '' : (r[k] || '').trim(); };
  const posisi = s => (s.trim() ? HURUF_OPSI.indexOf(s.trim().toUpperCase()) : -1);
  return baris.slice(1).map(r => {
    const j = ambil(r, 'jenis').toUpperCase(), q = ambil(r, 'pertanyaan');
    if (j === 'ISIAN'){
      const konsep = ambil(r, 'konsep').split('|').map(g => g.split('/').map(s => s.trim().toLowerCase()).filter(Boolean)).filter(g => g.length);
      return {j, q, kunci: ambil(r, 'kunci'), konsep};
    }
    const o = ['opsi_a', 'opsi_b', 'opsi_c', 'opsi_d', 'opsi_e'].map(n => ambil(r, n));
    const kunci = ambil(r, 'kunci');
    if (j === 'PGK') return {j, q, o, a: kunci.split(/[,;\s]+/).map(posisi).filter(x => x >= 0)};
    return {j, q, o, a: posisi(kunci)};
  });
}
function imporSoalFile(inp){
  const f = inp.files && inp.files[0];
  inp.value = '';
  if (!f) return;
  const baca = new FileReader();
  baca.onload = () => {
    let v;
    try {
      const teks = String(baca.result).replace(/^\uFEFF/, '');
      v = /\.json$/i.test(f.name) ? JSON.parse(teks) : csvKeSoal(teks);
    } catch (e){ S.admMsg = 'File tidak bisa dibaca: ' + e.message; return render(); }
    const err = cekSemuaSoal(v);
    if (err){ S.admMsg = 'File ditolak. ' + err; return render(); }
    S.admDrafts = S.admDrafts || {};
    S.admDrafts[S.admSoalSem] = v;
    S.admSoalNo = 1;
    S.admMsg = `${v.length} soal dari file dimuat ke draf. Periksa, lalu tekan "Simpan semua soal".`;
    render();
  };
  baca.readAsText(f);
}
function eksporSoalCsv(){
  bacaFormSoal();
  const baris = [['jenis', 'pertanyaan', 'opsi_a', 'opsi_b', 'opsi_c', 'opsi_d', 'opsi_e', 'kunci', 'konsep']];
  draftSoal().forEach(x => {
    const n = normalisasiSoal(x);
    if (n.j === 'ISIAN') baris.push([n.j, n.q, '', '', '', '', '', n.kunci, n.konsep.map(g => g.join('/')).join('|')]);
    else {
      const kunci = n.j === 'PGK' ? n.a.map(i => HURUF_OPSI[i]).join(',') : (n.a >= 0 ? HURUF_OPSI[n.a] : '');
      baris.push([n.j, n.q, ...n.o, kunci, '']);
    }
  });
  const isi = baris.map(r => r.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\uFEFF' + isi], {type: 'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = `soal-${S.admSoalSem}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function localInput(ms){
  const t = new Date(ms + WIB);
  return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}T${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())}`;
}
function admPengaturanHtml(){
  const blok = JADWAL.map(j => `<h3>${esc(j.label)}</h3><div class="row">
      <label>Dibuka (WIB)<input type="datetime-local" id="buka_${j.id}" value="${localInput(j.bukaMs)}"></label>
      <label>Ditutup (WIB)<input type="datetime-local" id="tutup_${j.id}" value="${localInput(j.tutupMs)}"></label></div>`).join('');
  return `<h2>Pengaturan</h2>${blok}
    <h3 style="margin-top:16px">Bobot nilai per soal</h3><div class="row">${[['pg', 'Pilihan ganda'], ['pgk', 'PG kompleks'], ['isian', 'Isian singkat']].map(([k, l]) => `<label>${l}<input type="number" min="0" step="0.5" id="bb_${k}" value="${bobotAkt()[k]}"></label>`).join('')}</div><p class="muted">Nilai maksimum mengikuti jumlah soal. Atur bobot agar totalnya sesuai kebutuhan, misalnya 100.</p>

    <p class="muted" style="margin-top:10px">Umpan balik benar atau salah selama ujian tetap nonaktif agar jawaban tidak bisa ditebak.</p>
    <div class="row end"><button onclick="simpanSet()">Simpan pengaturan</button></div>`;
}
function simpanSet(){
  const next = {};
  for (const j of JADWAL){
    const b = $('#buka_' + j.id).value, t = $('#tutup_' + j.id).value;
    if (!b || !t) return setAdmMsg('Tanggal dibuka dan ditutup harus diisi.');
    const bu = b + ':00+07:00', tu = t + ':00+07:00';
    if (!(Date.parse(bu) < Date.parse(tu))) return setAdmMsg(`Waktu tutup ${j.label} harus setelah waktu buka.`);
    next[j.id] = {buka: bu, tutup: tu};
  }
  PENG.jadwal = next;
  PENG.tampilkanKunci = $('#kunciCb').checked;
  PENG.bobot = {pg: Number($('#bb_pg').value), pgk: Number($('#bb_pgk').value), isian: Number($('#bb_isian').value)};
  applyJadwal();
  simpanPengaturan().then(ok => setAdmMsg(ok ? 'Pengaturan disimpan.' : 'Pengaturan gagal disimpan.'));
}

/* --- Rekap CSV --- */
function buildCsv(){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const head = ['No. Absen', 'Username'];
  JADWAL.forEach(j => head.push(`Status ${j.label}`, `Nilai ${j.label}`, `Benar ${j.label}`, `Salah ${j.label}`, `Kosong ${j.label}`, `Waktu Kumpul ${j.label}`, `Pelanggaran ${j.label}`));
  const baris = CONFIG.peserta.map(p => {
    const row = [p.id, p.nama];
    JADWAL.forEach(j => {
      const rec = (S.adm[p.id] || {})[j.id], kor = (S.admKor[p.id] || {})[j.id] || {};
      if (!rec || !rec.startAt){ row.push('Belum mulai', '', '', '', '', '', ''); return; }
      if (!rec.submittedAt){ row.push('Sedang ujian', '', '', '', '', '', Number(rec.pelanggaran || 0)); return; }
      const r = ringkas(j.id, rec, kor);
      row.push('Selesai', r.pts, r.b, r.s, r.k, fmtTgl(rec.submittedAt), Number(rec.pelanggaran || 0));
    });
    return row;
  });
  return [head.map(q).join(',')].concat(baris.map(r => r.map(q).join(','))).join('\r\n');
}
function admRekapHtml(){
  return `<h2>Rekap CSV</h2>
    
    <div class="row" style="margin:12px 0"><button onclick="unduhCsv()">Unduh CSV</button><button class="ghost" onclick="pilihCsv()">Pilih teks rekap</button><button class="ghost" onclick="muatUlangAdm(true)">Perbarui data</button></div>
    <textarea id="csv" readonly style="min-height:300px;font-family:monospace;font-size:12px">${esc(buildCsv())}</textarea>`;
}
function pilihCsv(){ const t = $('#csv'); t.focus(); t.select(); }
async function unduhCsv(){
  const csv = buildCsv(), nama = 'rekap-cbt-mplb-kelas-x.csv';
  try {
    const dl = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null;
    if (dl){ await dl.save({filename: nama, data: '\ufeff' + csv}); return setAdmMsg('Rekap CSV berhasil disimpan.'); }
  } catch(e){ if (e && e.code === 'declined') return setAdmMsg('Unduhan dibatalkan.'); }
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = nama;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  setAdmMsg('Rekap CSV diunduh.');
}

/* --- Impor soal dari berbagai jenis file --- */
const LIB = {mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js', pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', pdfw: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js', xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'};
const LIBG = {mammoth: 'mammoth', pdf: 'pdfjsLib', xlsx: 'XLSX'};
function muatLib(k){
  if (window[LIBG[k]]) return Promise.resolve();
  return new Promise((ok, no) => {
    const el = document.createElement('script'); el.src = LIB[k]; el.onload = ok;
    el.onerror = () => no(new Error('pembaca file gagal dimuat. Perangkat perlu tersambung ke internet untuk membuka ' + (k === 'pdf' ? 'PDF' : k === 'xlsx' ? 'Excel' : 'Word') + '.'));
    document.head.appendChild(el);
  });
}
async function pdfKeTeks(buf){
  await muatLib('pdf'); pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfw;
  const doc = await pdfjsLib.getDocument({data: buf}).promise; let out = '';
  for (let p = 1; p <= doc.numPages; p++){
    const c = await (await doc.getPage(p)).getTextContent(); let y = null;
    c.items.forEach(it => { const yy = it.transform[5]; if (y !== null && Math.abs(yy - y) > 3) out += '\n'; out += it.str + (it.hasEOL ? '\n' : ''); y = yy; });
    out += '\n';
  }
  return out;
}
function htmlKeTeks(h){ return new DOMParser().parseFromString(h.replace(/<\/(p|div|li|tr|h\d)>|<br\s*\/?>/gi, '$&\n'), 'text/html').body.textContent; }
const csvOk = t => /^\uFEFF?\s*"?jenis"?\s*,/i.test(t);
// Mengubah teks bebas (hasil Word/PDF/TXT) menjadi daftar soal. Soal bernomor, pilihan A-E, kunci di bawah soal atau di bagian "Kunci Jawaban".
function docxKeTeks(h){
  const d = new DOMParser().parseFromString(h.replace(/<strong>/g, '**').replace(/<\/strong>/g, '**'), 'text/html');
  d.querySelectorAll('ol').forEach(ol => {
    const dalam = !!(ol.parentElement && ol.parentElement.closest('ol')); let n = 0;
    [...ol.children].forEach(li => { if (li.tagName === 'LI'){ n++; li.insertBefore(d.createTextNode((dalam ? String.fromCharCode(64 + n) : n) + '. '), li.firstChild); } });
  });
  d.querySelectorAll('ol,ul').forEach(e => e.insertAdjacentText('beforebegin', '\n'));
  return htmlKeTeks(d.body.innerHTML);
}
// Membaca soal dari teks apa adanya. Tidak wajib ada kata "Kunci": kunci bisa berupa huruf tebal (Word), tanda * atau ✓, tabel kunci di akhir, atau "Jawaban: B".
function teksKeSoal(t, ulang){
  t = t.replace(/\r/g, '').replace(/[\u00a0\u200b]/g, ' ');
  const NOMOR = /^(?:soal\s*)?(?:no\.?\s*)?(\d{1,3})\s*[.):]\s*(.+)/i, OPSI = /^\(?([A-Ea-e])(?:[.):]|\s-)\s+(.+)/;
  const KUNCI = /^(?:kunci(?:\s+jawaban)?|jawaban(?:\s+benar)?|jawab|key|answer|ans)\s*[:=\-]\s*(.+)/i, TANDA = /(?:✓|✔|\((?:benar|kunci)\)|\*)\s*$/i;
  if (!ulang && !t.split('\n').some(l => NOMOR.test(l.replace(/\*\*/g, '').trim()))) t = t.split(/\n\s*\n/).filter(b => b.trim()).map((b, i) => (i + 1) + '. ' + b.trim()).join('\n');
  const kunciTab = {}, m = t.match(/^\s*(?:kunci(?:\s+jawaban)?|jawaban)\s*(?:soal|pilihan ganda|isian|pg|pgk)?\s*:?\s*$/im);
  if (m){
    const sisa = t.slice(m.index + m[0].length); t = t.slice(0, m.index);
    sisa.replace(/(\d+)\s*[.):=\-\s]\s*([A-Ea-e](?:\s*[,;&]\s*[A-Ea-e])*)(?![A-Za-z])/g, (_, n, k) => { kunciTab[n] = k; return ''; });
    sisa.split('\n').forEach(l => { const x = l.match(/^\s*(\d+)\s*[.):=\-]\s*(.{2,})$/); if (x && !kunciTab[x[1]] && !/^[A-Ea-e]([\s,;&]+[A-Ea-e])*$/.test(x[2].trim())) kunciTab[x[1]] = x[2].trim(); });
  }
  const hasil = []; let cur = null, last = -1;
  const tutup = () => { if (cur) hasil.push(cur); cur = null; last = -1; };
  t.split('\n').forEach(raw => {
    const tebal = raw.includes('**'), l = raw.replace(/\*\*/g, '').trim(); if (!l) return;
    let x;
    if ((x = l.match(NOMOR))){ tutup(); cur = {n: x[1], q: x[2], o: [], k: '', mk: []}; }
    else if (cur && (x = l.match(OPSI))){ last = 'ABCDE'.indexOf(x[1].toUpperCase()); if (tebal || TANDA.test(l)) cur.mk.push(last); cur.o[last] = x[2].replace(/\s*(?:✓|✔|\((?:benar|kunci)\)|\*)\s*$/i, '').trim(); }
    else if (cur && (x = l.match(KUNCI))){ cur.k = x[1].trim(); last = -2; }
    else if (cur){ if (last >= 0) cur.o[last] += ' ' + l; else if (last === -2) cur.k += ' ' + l; else cur.q += ' ' + l; }
  });
  tutup();
  return hasil.map(c => {
    const kr = c.k || kunciTab[c.n] || '', kk = kr.replace(/\bdan\b/gi, ',').trim();
    const opsi = [0, 1, 2, 3, 4].map(i => c.o[i] || ''), ada = opsi.filter(Boolean).length;
    const huruf = /^[A-Ea-e](?:[\s,;&]+[A-Ea-e])*\.?$/.test(kk) ? kk.toUpperCase().match(/[A-E]/g) : [];
    let idx = huruf.map(h => 'ABCDE'.indexOf(h)).filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b);
    if (!idx.length && c.mk.length && c.mk.length < ada) idx = [...new Set(c.mk)].sort((a, b) => a - b);
    const q = c.q.replace(/\s*\((?:PGK|PG kompleks)\)\s*/i, ' ').trim();
    const pgk = /\(\s*(?:PGK|PG kompleks)\s*\)|lebih dari satu|semua yang benar/i.test(c.q) || idx.length > 1;
    if (ada >= 2) return pgk ? {j: 'PGK', q, o: opsi, a: idx} : {j: 'PG', q, o: opsi, a: idx.length ? idx[0] : -1};
    const kata = [...new Set(kr.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 3))];
    return {j: 'ISIAN', q, kunci: kr, konsep: kata.length ? kata.map(w => [w]) : (kr ? [[kr.toLowerCase()]] : [])};
  });
}
async function berkasKeSoal(f){
  const ext = f.name.toLowerCase().split('.').pop();
  let v;
  if (ext === 'json'){
    v = JSON.parse((await f.text()).replace(/^\uFEFF/, ''));
    if (!Array.isArray(v)) throw new Error('JSON harus berupa daftar soal.');
  } else if (ext === 'doc') throw new Error('format .doc lama tidak didukung. Buka di Word lalu simpan sebagai .docx.');
  else if (/^(png|jpe?g|gif|webp|bmp)$/.test(ext)) throw new Error('gambar atau foto tidak bisa dibaca. Gunakan file teks, Word, atau PDF yang tekstnya bisa diblok.');
  else {
    let teks;
    if (ext === 'docx'){ await muatLib('mammoth'); teks = docxKeTeks((await mammoth.convertToHtml({arrayBuffer: await f.arrayBuffer()})).value); }
    else if (ext === 'pdf') teks = await pdfKeTeks(await f.arrayBuffer());
    else if (ext === 'xlsx' || ext === 'xls'){
      await muatLib('xlsx');
      const ws = XLSX.read(await f.arrayBuffer()).Sheets; const sh = ws[Object.keys(ws)[0]];
      const csv = XLSX.utils.sheet_to_csv(sh);
      teks = csvOk(csv) ? null : XLSX.utils.sheet_to_json(sh, {header: 1}).map(r => r.join(' ')).join('\n');
      if (teks === null) v = csvKeSoal(csv);
    } else {
      teks = (await f.text()).replace(/^\uFEFF/, '');
      if (ext === 'html' || ext === 'htm') teks = htmlKeTeks(teks);
      if ((ext === 'csv' || ext === 'tsv') && csvOk(teks)){ v = csvKeSoal(teks); teks = null; }
    }
    if (!v) v = teksKeSoal(teks);
  }
  return v.map(x => normalisasiSoal(x)).filter(x => x.j in JENIS_NAMA && x.q);
}
async function imporBerkas(inp){
  const f = inp.files && inp.files[0]; if (!f) return;
  const sem = ($('#imSem') || {}).value || S.admSoalSem, mode = ($('#imMode') || {}).value || 'tambah'; inp.value = '';
  setAdmMsg('Membaca ' + f.name + '...');
  try {
    const v = await berkasKeSoal(f);
    if (!v.length) throw new Error('tidak ada soal yang terbaca di file ini.');
    S.admSoalSem = sem; S.admDrafts = S.admDrafts || {};
    const dasar = mode === 'tambah' ? draftSoal() : [], awal = dasar.length + 1;
    if (dasar.length + v.length > 100) throw new Error('jumlah soal melebihi 100.');
    if (mode === 'ganti' && !(await tanya(`${v.length} soal terbaca dari ${f.name}. Soal lama ${JADWAL.find(j => j.id === sem).label} akan diganti. Lanjutkan?`))) return setAdmMsg('Impor dibatalkan.');
    S.admDrafts[sem] = dasar.concat(v); S.admTab = 'soal'; S.admSoalNo = awal;
    PENG.soal = PENG.soal || {}; PENG.soal[sem] = JSON.parse(JSON.stringify(S.admDrafts[sem]));
    const ok = await simpanPengaturan(), perlu = v.filter(x => validSatuSoal(x)).length;
    S.admMsg = `${v.length} soal dari ${f.name} sudah masuk dan langsung tersimpan (nomor ${awal} dst.). Muat ulang halaman, soalnya sudah ada.`
      + (perlu ? ` ${perlu} soal belum ada kunci atau pilihannya kurang (bertanda merah di tab Soal). Soal itu belum bisa dinilai sampai dilengkapi.` : '') + (ok ? '' : ' Gagal menyimpan.');
    render();

  } catch(e){ setAdmMsg('File gagal dibaca: ' + e.message); }
}

function tick(){
  const now = Date.now();
  const jm = $('#jam');
  if (jm) jm.textContent = jamDetik(now) + ' WIB';
  const lm = $('#lama'), dd = S.rec && S.rec[S.sem];
  if (lm && S.view === 'ujian' && dd && dd.startAt){ const jj = JADWAL.find(x => x.id === S.sem), sisa = batasUjian(jj, dd) - now; lm.textContent = '⏳ Sisa ' + fmtDur(sisa); lm.classList.toggle('dur-warn', sisa < 300000); }
  if (lm && S.view === 'ujian' && dd && dd.startAt){ const t = Math.max(0, Math.floor((now - dd.startAt) / 1000)); lm.textContent = '⏱ ' + pad(Math.floor(t / 3600)) + ':' + pad(Math.floor(t % 3600 / 60)) + ':' + pad(t % 60) + sisaTeks(); }

  if (S.view === 'ujian'){
    const j = JADWAL.find(x => x.id === S.sem), d = S.rec[S.sem];
    if (!d || d.submittedAt || now >= batasUjian(j, d)){
      kumpul(S.sem, true);
      S.view = 'hasil';
      render();
    }
  } else if (S.view === 'dash' && S.ready){
    let sig = '';
    JADWAL.forEach(j => {
      const st = statusSem(j);
      const r = ringkas(j.id, S.rec[j.id], S.kor[j.id]);
      sig += j.id + st.kode + (st.kode === 'selesai' ? r.pts : '') + ';';
    });
    if (sig !== S.sig) render();
  }
}


/* ===== Anti-kecurangan & kompatibilitas perangkat ===== */
const MAXPEL = 5, GRATIS = 2;
function penaltiPel(n){ return Math.max(0, (Number(n) || 0) - GRATIS) * 10; }
let warningToastTimer = null, lastPel = 0, fsDipakai = false, wakeLock = null;
function aktifUjian(){ return !!(S.user && S.view === 'ujian' && S.sem && S.rec[S.sem] && !S.rec[S.sem].submittedAt); }
function catatPelanggaran(jenis){
  if (!aktifUjian()) return;
  const now = Date.now(); if (now - lastPel < 2500) return; lastPel = now;
  const d = S.rec[S.sem]; d.pelanggaran = Number(d.pelanggaran || 0) + 1;
  d.log = (d.log || []).concat([{t: now, j: jenis, no: d.cur + 1}]).slice(-50);
  tulisHasil(S.sem);
  const n = d.pelanggaran, badge = document.getElementById('violationBadge');
  if (badge) badge.innerHTML = `⚠ PELANGGARAN: ${n}/${MAXPEL} · −${penaltiPel(n)} poin`;
  toastMsg(n >= MAXPEL ? `⚠ Pelanggaran ke-${n} (${jenis}). Ujian diakhiri otomatis.` : `⚠ PERINGATAN ${n}/${MAXPEL}: ${jenis}. ` + (n <= GRATIS ? 'Belum ada pengurangan nilai, tetapi jangan diulangi.' : `Nilai berkurang ${penaltiPel(n)} poin.`), 8000);
  if (n >= MAXPEL){ kumpul(S.sem, true); S.view = 'hasil'; render(); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) catatPelanggaran('Meninggalkan halaman/tab ujian'); });
window.addEventListener('pagehide', () => { if (!document.hidden) catatPelanggaran('Menutup/berpindah halaman'); });

function masukLayarPenuh(){
  const el = document.documentElement;
  const iphone = /iPhone|iPod/.test(navigator.userAgent);
  if (iphone || !(el.requestFullscreen || el.webkitRequestFullscreen)) return;
  try { const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.then) p.then(() => { fsDipakai = true; }).catch(() => {}); else fsDipakai = true; } catch (e) {}
}
function keluarLayarPenuh(){
  fsDipakai = false;
  const o = document.getElementById('fsOverlay'); if (o) o.remove();
  try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen(); } catch (e) {}
}
function cekLayarPenuh(){
  const aktif = document.fullscreenElement || document.webkitFullscreenElement;
  if (aktif || !fsDipakai || !aktifUjian()) return;
  catatPelanggaran('Keluar dari layar penuh');
  if (!aktifUjian() || document.getElementById('fsOverlay')) return;
  const o = document.createElement('div'); o.id = 'fsOverlay';
  o.innerHTML = '<h2 style="color:#fff">Ujian dijeda</h2><p>Anda keluar dari layar penuh. Kembali ke layar penuh untuk melanjutkan. Waktu ujian tetap berjalan.</p><button id="fsBack">Kembali ke layar penuh</button>';
  document.body.appendChild(o);
  document.getElementById('fsBack').onclick = () => { o.remove(); masukLayarPenuh(); };
}
document.addEventListener('fullscreenchange', cekLayarPenuh);
document.addEventListener('webkitfullscreenchange', cekLayarPenuh);

async function siapUjian(){
  if (S.view === 'ujian'){
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
  } else {
    if (wakeLock){ try { wakeLock.release(); } catch (e) {} wakeLock = null; }
    if (fsDipakai || document.getElementById('fsOverlay')) keluarLayarPenuh();
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && aktifUjian() && !wakeLock) siapUjian(); });

['contextmenu', 'copy', 'cut', 'paste', 'dragstart'].forEach(ev => document.addEventListener(ev, e => { if (aktifUjian()) e.preventDefault(); }));
document.addEventListener('selectstart', e => { if (aktifUjian() && !(e.target && e.target.closest && e.target.closest('input,textarea'))) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (!aktifUjian()) return;
  const k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey;
  if (k === 'f12' || (c && ['c', 'v', 'x', 'u', 's', 'p', 'a'].includes(k)) || (c && e.shiftKey && ['i', 'j', 'c'].includes(k))) { e.preventDefault(); return; }
  if (k === 'printscreen'){ try { navigator.clipboard.writeText(''); } catch (x) {} toastMsg('Tangkapan layar tidak diizinkan selama ujian.', 4000); }
});

/* --- Nama siswa: ubah manual atau dari file, langsung berlaku (cukup muat ulang halaman) --- */
function applyNama(){
  CONFIG.peserta.forEach(p => { if (p._nama0 === undefined) p._nama0 = p.nama; p.nama = (PENG.nama && PENG.nama[p.id]) || p._nama0; });
}
function setNama(p, v){
  v = String(v || '').trim().replace(/\s+/g, ' ');
  if (!v) v = p._nama0;
  if (CONFIG.peserta.some(x => x.id !== p.id && x.nama.toUpperCase() === v.toUpperCase())) return false;
  PENG.nama = PENG.nama || {};
  if (v === p._nama0) delete PENG.nama[p.id]; else PENG.nama[p.id] = v;
  p.nama = v; return true;
}
async function ubahNama(id, v){
  const p = CONFIG.peserta.find(x => x.id === id); if (!p) return;
  if (!setNama(p, v)){ S.admMsg = 'Nama itu sudah dipakai siswa lain.'; return render(); }
  const ok = await simpanPengaturan();
  S.admMsg = ok ? `Absen ${id} sekarang bernama ${p.nama}.` : 'Gagal menyimpan.';
  render();
}
async function bacaTeksBerkas(f){
  const ext = f.name.toLowerCase().split('.').pop();
  if (ext === 'docx'){ await muatLib('mammoth'); return (await mammoth.extractRawText({arrayBuffer: await f.arrayBuffer()})).value; }
  if (ext === 'pdf') return pdfKeTeks(await f.arrayBuffer());
  if (ext === 'xlsx' || ext === 'xls'){ await muatLib('xlsx'); const w = XLSX.read(await f.arrayBuffer()); return XLSX.utils.sheet_to_csv(w.Sheets[w.SheetNames[0]]); }
  return (await f.text()).replace(/^\uFEFF/, '');
}
// Isi file: "absen, nama" per baris, atau cukup daftar nama berurutan (absen 01, 02, dst.).
async function imporNama(inp){
  const f = inp.files && inp.files[0]; if (!f) return; inp.value = '';
  try {
    const teks = await bacaTeksBerkas(f), urut = [], peta = {};
    teks.replace(/\r/g, '').split('\n').forEach(raw => {
      const b = raw.split(/[,;\t]/).map(x => x.trim().replace(/^"|"$/g, '')).filter(Boolean);
      if (!b.length || /^(absen|no|nomor|id|nama)$/i.test(b[0])) return;
      const k = /^\d{1,3}$/.test(b[0]) ? b[0].padStart(2, '0') : b[0].toUpperCase();
      const p = b.length > 1 ? CONFIG.peserta.find(x => x.id.toUpperCase() === k) : null;
      if (p) peta[p.id] = b.slice(1).join(' ');
      else urut.push(b.join(' ').replace(/^\d+\s*[.)]\s*/, ''));
    });
    CONFIG.peserta.forEach((p, i) => { if (!(p.id in peta) && urut[i]) peta[p.id] = urut[i]; });
    let ok = 0, lewat = 0;
    CONFIG.peserta.forEach(p => { if (p.id in peta){ if (setNama(p, peta[p.id])) ok++; else lewat++; } });
    if (!ok && !lewat) throw new Error('tidak ada nama yang terbaca.');
    const simpan = await simpanPengaturan();
    S.admMsg = `${ok} nama diperbarui.` + (lewat ? ` ${lewat} dilewati karena kembar dengan nama lain.` : '') + (simpan ? '' : ' Gagal menyimpan.');
    render();
  } catch(e){ setAdmMsg('File gagal dibaca: ' + e.message); }
}
async function kembalikanNama(){
  if (!(await tanya('Kembalikan semua nama siswa ke nama awal?'))) return;
  PENG.nama = {}; applyNama();
  const ok = await simpanPengaturan();
  S.admMsg = ok ? 'Semua nama dikembalikan.' : 'Gagal menyimpan.'; render();
}

  return `<h2>Nama Siswa</h2>

const dset = async (p, d) => { try { await DB_READY; if (!DB) return false; await tunggu(DB.doc(p).set(d)); return true; } catch(e){ return false; } };

setInterval(async () => {
  if (!S.user || S.view === 'admin' || S.view === 'login' || S.view === 'adminLogin') return;
  const id = S.user.id;
  if (klaim !== id){ klaim = id; await dset('sesi/' + id, {tok: TOK, hb: Date.now()}); for (const k of [id, 'semua']){ const c = await dget('kontrol/' + k); ktrlT[k] = (c && c.t) || 0; } return; }
  const s = await dget('sesi/' + id);
  if (s && s.tok && s.tok !== TOK){ klaim = null; toastMsg('Akun ini dipakai di perangkat lain. Anda dikeluarkan.', 6000); return keluar(); }
  await dset('sesi/' + id, {tok: TOK, hb: Date.now()});
  for (const k of [id, 'semua']){
    const c = await dget('kontrol/' + k); if (!c || !c.t || c.t <= (ktrlT[k] || 0)) continue; ktrlT[k] = c.t;
    if (c.aksi === 'pesan') toastMsg('📢 Pengawas: ' + String(c.pesan || '').slice(0, 200), 10000);
    else if (c.aksi === 'batal' && aktifUjian()){ const d = S.rec[S.sem]; d.pelanggaran = Math.max(0, Number(d.pelanggaran || 0) - 1); tulisHasil(S.sem); toastMsg('Pengawas membatalkan 1 pelanggaran Anda.', 6000); }
    else if (c.aksi === 'kumpul' && aktifUjian()){ kumpul(S.sem, true); S.view = 'hasil'; render(); }
  }
}, 8000);

  await Promise.all(JADWAL.map(async j => { A.izin[j.id] = (await dget('izin/' + j.id)) || {}; }));
  if (S.view === 'admin' && S.admTab === 'awas') render();
}

async function awasIzin(sem, id){
  const iz = (await dget('izin/' + sem)) || {}; iz.ids = iz.ids || {};
  if (id === 'semua') iz.semua = !iz.semua; else iz.ids[id] = !iz.ids[id];
  const ok = await dset('izin/' + sem, iz); audit('izin', sem + ' ' + id);
  S.admMsg = ok ? 'Izin diperbarui.' : 'Gagal menyimpan (pastikan Anda pemilik/editor halaman).'; awasMuat();
}

async function awasKumpul(id){ if (await tanya('Paksa kumpul ujian siswa absen ' + id + '?')) awasKirim(id, 'kumpul'); }

})();
